services:
  db:
    image: postgres:16-alpine
    container_name: medfits_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medfits
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medfits_dev_password}
      POSTGRES_DB: medfits_db
    ports:
      - "5432:5432"
    volumes:
      - medfits_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medfits -d medfits_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: medfits_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://medfits:${POSTGRES_PASSWORD:-medfits_dev_password}@db:5432/medfits_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  medfits_pgdata:
