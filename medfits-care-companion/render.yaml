databases:
  - name: medfits-db
    databaseName: medfits_db
    user: medfits
    plan: free

services:
  - type: web
    name: medfits-care-companion
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medfits-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
